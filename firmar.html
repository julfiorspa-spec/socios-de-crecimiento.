<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abriendo compra · CotizÁgil</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1c3c;color:#f6f8fc;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:16px}
a{color:#d9c9ff}</style></head>
<body><div><div style="font-size:34px">✍</div><b id="t">Abriendo la compra…</b>
<p style="opacity:.8;font-size:14px">Si Mercado Público te pide iniciar sesión, ingresa:<br>después vuelves sola a la compra y se llena.</p>
<p><a id="ir" href="#">Ir a la compra ahora</a></p></div>
<script>
  // Firma rápida (extensión) guarda la compra y salta antes; si no está instalada, salta igual a los 2 s.
  const cod = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  const url = "https://compra-agil.mercadopublico.cl/resumen-cotizacion/" + encodeURIComponent(cod);
  document.getElementById("t").textContent = "Abriendo la compra " + cod + "…";
  document.getElementById("ir").href = url;
  if (/-COT\d+$/.test(cod)) setTimeout(() => location.replace(url), 2000);
</script></body></html>
