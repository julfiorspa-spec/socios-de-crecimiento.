# Versión para repositorio sin carpetas: todos los archivos están en la raíz.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# El userscript nunca se cachea: Tampermonkey (PC) y Userscripts (iPhone) siempre bajan la última versión.
[[headers]]
  for = "/cotizagil-firma.user.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cualquier ruta (/app, /panel, ...) abre la app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
